<!DOCTYPE html>
<body style="background: #f0f0f0; margin: 0; display: flex; justify-content: center; align-items: center; min-height: 100vh;">
  <div style="display: flex; flex-direction: row; gap: 60px; align-items: flex-start; padding: 40px;">
    <div>
      <h4 style="font-family: monospace; margin: 0 0 12px; font-size: 13px; letter-spacing: 0.05em;">GPU (WebGPU)</h4>
      <canvas id="main" width="450" height="450" style="background-color: #fff; display: block; box-shadow: 0 2px 8px rgba(0,0,0,0.15);"></canvas>
    </div>
    <div>
      <h4 style="font-family: monospace; margin: 0 0 12px; font-size: 13px; letter-spacing: 0.05em;">CPU (JavaScript)</h4>
      <canvas id="debug" width="450" height="450" style="background: #222; display: block; box-shadow: 0 2px 8px rgba(0,0,0,0.15);"></canvas>
      <div id="progress" style="font-family: monospace; font-size: 12px; text-align: end; margin-top: 6px; color: #666;"></div>
    </div>
  </div>
  <script src="index.js"></script>
</body>
